name: Deploy to server via SSH

# Copies index.html and assets/ (art, sound effects) to a directory on a
# self-hosted server over SSH, in addition to (not instead of) the GitHub
# Pages deploy in deploy-pages.yml.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret) before this workflow can run:
#   DEPLOY_HOST      server IP or domain
#   DEPLOY_USER      SSH username on the server
#   DEPLOY_PASSWORD  password for DEPLOY_USER (this server only accepts
#                    password auth, not key-based auth)
#   DEPLOY_PORT      optional, only needed if SSH runs on a non-default port
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-ssh"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Supabase anon key
        # Keeps this deploy target's leaderboard in sync with deploy-pages.yml
        # — see that workflow for why the placeholder swap exists.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os

          key = os.environ.get("SUPABASE_ANON_KEY", "")
          if not key:
              print("::warning::SUPABASE_API_KEY secret is not set; leaderboard will be disabled.")
          else:
              with open("index.html", "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("__SUPABASE_ANON_KEY__", key)
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(content)
          PY
      - name: Copy site files to server
        # Uses the real OpenSSH client (via sshpass) instead of a Go SSH
        # library, because this server accepts interactive password auth
        # (keyboard-interactive) but rejects the Go library's "password"
        # auth method — the same mismatch a plain `ssh`/`scp` from a
        # terminal doesn't hit.
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          sshpass -e scp -r -P "${{ secrets.DEPLOY_PORT || 22 }}" index.html assets "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/www/p03/"
