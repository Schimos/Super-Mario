name: Deploy to server via SSH

# Copies index.html to a directory on a self-hosted server over SSH, in
# addition to (not instead of) the GitHub Pages deploy in deploy-pages.yml.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret) before this workflow can run:
#   DEPLOY_HOST     server IP or domain
#   DEPLOY_USER     SSH username on the server
#   DEPLOY_SSH_KEY  private key contents (a dedicated deploy key, not your
#                   personal one) whose matching public key is authorized
#                   on the server for DEPLOY_USER
#   DEPLOY_PORT     optional, only needed if SSH runs on a non-default port
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-ssh"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy index.html to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "index.html"
          target: "/srv/www/p03/"
          strip_components: 0
